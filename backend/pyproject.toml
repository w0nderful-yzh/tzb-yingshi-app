[project]
name = "tzb-yingshi-backend"
version = "0.1.0"
description = "FastAPI backend for the elderly safety monitoring project"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0,<1.0",
    "imageio-ffmpeg>=0.6.0,<1.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20,<1.0",
    "scikit-learn>=1.4.0,<2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.35.0",
    "webrtcvad-wheels>=2.0.14,<3.0",
]

[project.optional-dependencies]
sensevoice = [
    "funasr>=1.3.14,<2.0",
    "llvmlite>=0.43,<1.0",
    "modelscope>=1.20,<2.0",
    "numba>=0.60,<1.0",
    "numpy>=1.26,<2.3",
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["funasr", "funasr.*", "imageio_ffmpeg", "webrtcvad"]
ignore_missing_imports = true
